name: Pipe diagnostic
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun test test/pipe.test.mjs -t "previous launch"
      - if: always()
        run: node --test --test-name-pattern="previous launch" test/pipe.test.mjs
