name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      # The page-video test (test/integration.test.mjs) needs ffmpeg with libvpx; without it the test skips.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor,
      # which makes Chromium's sandbox abort (SIGTRAP) at launch.
      - name: Allow unprivileged user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install chrome-headless-shell
        id: browser
        shell: bash
        run: |
          out=$(bunx @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/browsers")
          bin=$(printf '%s\n' "$out" | tail -n 1 | awk '{print $2}')
          test -x "$bin"
          "$bin" --version
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: bun test
        env:
          SHELL_BIN: ${{ steps.browser.outputs.bin }}
          CLOAKBROWSER_BIN: ${{ steps.browser.outputs.bin }}
        shell: bash
        run: bun run test 2>&1 | tee "$RUNNER_TEMP/bun-test.log"

      - name: node --test
        env:
          SHELL_BIN: ${{ steps.browser.outputs.bin }}
          CLOAKBROWSER_BIN: ${{ steps.browser.outputs.bin }}
        shell: bash
        run: bun run test:node 2>&1 | tee "$RUNNER_TEMP/node-test.log"

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          count() { grep -E "$2" "$1" 2>/dev/null | tail -n 1 | grep -oE '[0-9]+' | head -n 1; }
          {
            echo "## CI (${{ job.status }})"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | ${{ job.status }} |"
            echo "| Runner | ${{ runner.os }} |"
            echo "| Browser | ${{ steps.browser.outputs.bin }} |"
            echo "| bun test pass / fail | $(count "$RUNNER_TEMP/bun-test.log" '^ *[0-9]+ pass$') / $(count "$RUNNER_TEMP/bun-test.log" '^ *[0-9]+ fail$') |"
            echo "| node --test pass / fail | $(count "$RUNNER_TEMP/node-test.log" '^ℹ pass [0-9]+') / $(count "$RUNNER_TEMP/node-test.log" '^ℹ fail [0-9]+') |"
            echo "| Ref | ${{ github.ref_name }} |"
            echo "| Commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The browser and BrowserSkill code has win32-only paths (named pipes, scheduled tasks, profile locks) that
  # the ubuntu job skips; this job runs the same two suites on Windows so those paths have a CI owner.
  # It runs on push to main, the daily schedule, and every pull request to main (#90 is closed); a manual
  # workflow_dispatch still runs only the ubuntu job.
  # macOS has its own platform paths (the /tmp, /var and /etc root aliases in the
  # native-messaging bridge, #47/#135; the named-instance lock backend, #62) that the
  # Linux and Windows jobs cannot exercise. This job runs the platform-specific files.
  test-macos:
    name: test (macos-latest, platform)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - name: bun test (platform files, default TMPDIR)
        run: bun test test/bridge-transport.test.mjs test/bridge-host-dir.test.mjs test/instances.test.mjs
      - name: node --test (platform files, default TMPDIR)
        run: node --test test/bridge-transport.test.mjs test/bridge-host-dir.test.mjs test/instances.test.mjs
      - name: bun and node (platform files, TMPDIR under /tmp)
        shell: bash
        run: |
          mkdir -p /tmp/omowright-ci
          TMPDIR=/tmp/omowright-ci bun test test/bridge-transport.test.mjs test/bridge-host-dir.test.mjs
          TMPDIR=/tmp/omowright-ci node --test test/bridge-transport.test.mjs test/bridge-host-dir.test.mjs

  test-windows:
    name: test (windows-latest)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      # Temporary #233 oracle; removed after collecting the CI receipt.
      - name: Lock error RED on base and GREEN on head
        shell: bash
        run: |
          cp src/lock-backend-win32.js "$RUNNER_TEMP/lock-backend-win32-head.js"
          git show 97f65ab:src/lock-backend-win32.js > src/lock-backend-win32.js
          set +e
          bun test test/instances.test.mjs --test-name-pattern 'Windows lock distinguishes'
          red=$?
          set -e
          cp "$RUNNER_TEMP/lock-backend-win32-head.js" src/lock-backend-win32.js
          test "$red" -ne 0
          bun test test/instances.test.mjs --test-name-pattern 'Windows lock distinguishes'
          node --test --test-name-pattern='Windows lock distinguishes' test/instances.test.mjs

      - name: Mixed runtime race repeated twenty times per runner
        shell: bash
        run: |
          for attempt in {1..20}; do
            echo "RACE_ITERATION=$attempt"
            bun test test/instances.test.mjs --test-name-pattern 'two processes racing.*mixed'
            node --test --test-name-pattern='two processes racing.*mixed' test/instances.test.mjs
          done

      # The page-video test (test/integration.test.mjs) needs ffmpeg with libvpx; without it the test skips.
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Install chrome-headless-shell
        id: browser
        shell: bash
        run: |
          out=$(bunx @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/browsers")
          bin=$(printf '%s\n' "$out" | tail -n 1 | awk '{print $2}')
          test -x "$bin"
          "$bin" --version
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: bun test
        env:
          SHELL_BIN: ${{ steps.browser.outputs.bin }}
          CLOAKBROWSER_BIN: ${{ steps.browser.outputs.bin }}
        shell: bash
        run: bun run test 2>&1 | tee "$RUNNER_TEMP/bun-test.log"

      - name: node --test
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          SHELL_BIN: ${{ steps.browser.outputs.bin }}
          CLOAKBROWSER_BIN: ${{ steps.browser.outputs.bin }}
        shell: bash
        run: bun run test:node 2>&1 | tee "$RUNNER_TEMP/node-test.log"

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          count() { grep -E "$2" "$1" 2>/dev/null | tail -n 1 | grep -oE '[0-9]+' | head -n 1; }
          {
            echo "## CI (${{ job.status }})"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | ${{ job.status }} |"
            echo "| Runner | ${{ runner.os }} |"
            echo "| Browser | ${{ steps.browser.outputs.bin }} |"
            echo "| bun test pass / fail | $(count "$RUNNER_TEMP/bun-test.log" '^ *[0-9]+ pass$') / $(count "$RUNNER_TEMP/bun-test.log" '^ *[0-9]+ fail$') |"
            echo "| node --test pass / fail | $(count "$RUNNER_TEMP/node-test.log" '^ℹ pass [0-9]+') / $(count "$RUNNER_TEMP/node-test.log" '^ℹ fail [0-9]+') |"
            echo "| Ref | ${{ github.ref_name }} |"
            echo "| Commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"
